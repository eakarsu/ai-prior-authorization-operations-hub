name: governed-prior-auth
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prior_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/prior_auth_test
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/prior_auth_test
      AUTH_SECRET: test-only-auth-secret-with-at-least-32-characters
      AUTH_ISSUER: prior-auth-ci
      AUTH_AUDIENCE: prior-auth-ci-client
      PRIOR_AUTH_ACTIVE_KEY_VERSION: v1
      PRIOR_AUTH_DATA_KEYS_JSON: '{"v1":"1111111111111111111111111111111111111111111111111111111111111111"}'
      PAYER_WEBHOOK_SECRET: test-only-webhook-secret-at-least-32-characters
      PROVIDER_WORKER_SECRET: test-only-worker-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ALLOW_SCHEMA_MIGRATION=1 ./start.sh migrate
      - run: ALLOW_SCHEMA_MIGRATION=1 ./start.sh migrate
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:governance
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
